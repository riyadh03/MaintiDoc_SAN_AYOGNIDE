services:
  ollama:
    image: ollama/ollama:latest
    container_name: maintidoc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintidoc-workspace
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - OLLAMA_HOST=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama_models:


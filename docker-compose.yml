services:
  ollama:
    image: ollama/ollama:latest
    container_name: maintidoc-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: maintidoc-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maintidoc-workspace
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - QDRANT_HOST=http://qdrant:6333
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  ollama_models:
  qdrant_storage:

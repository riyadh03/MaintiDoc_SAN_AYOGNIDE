[project]
name = "maintidoc"
version = "0.1.0"
description = "MaintiDoc — Plateforme Agentique Multimodale de Maintenance SAN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=8.20.0",
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-huggingface>=0.3.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.2.0",
    "pymupdf>=1.24.0",
    "pydantic>=2.7.0",
    "qdrant-client>=1.10.0",
    "sentence-transformers>=3.0.0",
    "tabulate>=0.9.0",
    "ollama>=0.2.0",
    "rank-bm25>=0.2.2",
    "rapidocr-onnxruntime>=1.4.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: tests réels (manuel SAN + modèles), exclure avec -m 'not slow'"]
